# gitleaks cho repo cong khai (quy tac PUB-08).
# Ke thua toan bo luat mac dinh. Chi bo qua DUNG tung gia tri GIA da duoc agent review duyet.
# Moi regex khop chinh xac mot gia tri (^...$). Mot ky tu boc trong [] de chinh file nay
# khong bi may quet bat. Khong allowlist thu muc, duong dan hay luat.
# Them gia tri gia moi vao day phai qua review (PUB-08). Secret that chi nam trong .secrets, khong bao gio len Git.

[extend]
useDefault = true

